# ============================================================
# Configuración del Microservicio de Productos
# DSY1106 - Desarrollo Full Stack III
# ============================================================

# Servidor
server.port=8081
spring.application.name=ms-productos

# Base de datos H2 (desarrollo/testing)
spring.datasource.url=jdbc:h2:mem:productos_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.com.duoc=DEBUG
logging.level.org.springframework.security=DEBUG
