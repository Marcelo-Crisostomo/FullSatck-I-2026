server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: productos-route
          uri: ${MS_PRODUCTOS_URI:http://localhost:8081}
          predicates:
            - Path=/api/productos/**

        - id: pedidos-route
          uri: ${MS_PEDIDOS_URI:http://localhost:8082}
          predicates:
            - Path=/api/pedidos/**
